
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.wrap{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:28px 20px 40px;width:100%}
.card-row{position:relative;margin-bottom:14px;transition:transform 0.5s cubic-bezier(0.34,1.4,0.64,1)}
.card{position:relative;background:#080808;cursor:none}
.card::before{content:'';position:absolute;inset:0;border:1px solid rgba(100,100,100,0.3);pointer-events:none;z-index:5;transition:border-color 0.3s}
.card.hovered::before{border-color:rgba(180,140,60,0.45)}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.10) 2px,rgba(0,0,0,0.10) 4px)}
.card canvas{display:block;position:relative;z-index:1}
.scan-a,.scan-b,.scan-c{position:absolute;left:0;right:0;pointer-events:none;z-index:6;display:none}
.scan-a{height:2px;background:rgba(180,140,60,0.22)}
.scan-b{height:1px;background:rgba(180,140,60,0.12)}
.scan-c{height:3px;background:rgba(180,140,60,0.08)}
.card.hovered .scan-a{display:block;animation:scanA 1.8s linear infinite}
.card.hovered .scan-b{display:block;animation:scanB 2.6s linear infinite 0.4s}
.card.hovered .scan-c{display:block;animation:scanC 3.4s linear infinite 1.1s}
@keyframes scanA{from{top:-2px}to{top:calc(100% + 2px)}}
@keyframes scanB{from{top:-1px}to{top:calc(100% + 1px)}}
@keyframes scanC{from{top:-3px}to{top:calc(100% + 3px)}}
.corner{position:absolute;width:9px;height:9px;border-color:rgba(180,140,60,0.6);border-style:solid;z-index:7;pointer-events:none;opacity:0;transition:opacity 0.3s}
.corner.tl{top:-1px;left:-1px;border-width:1px 0 0 1px}
.corner.tr{top:-1px;right:-1px;border-width:1px 1px 0 0}
.corner.bl{bottom:-1px;left:-1px;border-width:0 0 1px 1px}
.corner.br{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.card.hovered .corner{opacity:1}
.label-wrap{position:relative;height:28px;margin-top:5px;overflow:visible;pointer-events:none}
.label-base{position:absolute;top:0;left:0;font-family:'Rajdhani',monospace;font-size:13px;letter-spacing:0.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;transform:translateY(16px);opacity:0;transition:transform 0.42s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease;color:rgba(210,175,80,0.95);z-index:3}
.label-r{position:absolute;top:0;left:0;font-family:'Rajdhani',monospace;font-size:13px;letter-spacing:0.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;color:rgba(220,40,40,0.55);z-index:2;opacity:0;pointer-events:none}
.label-b{position:absolute;top:0;left:0;font-family:'Rajdhani',monospace;font-size:13px;letter-spacing:0.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;color:rgba(40,80,220,0.55);z-index:2;opacity:0;pointer-events:none}
.card-row.hovered-row .label-base{transform:translateY(0);opacity:1}
.cursor-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(210,175,80,0.9);pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:100}
</style>

<div class="wrap" id="wrap">
  <div class="card-row" id="row0" style="width:100%;max-width:620px">
    <div class="card" id="c0">
      <canvas id="cv0"></canvas>
      <div class="scanlines"></div>
      <div class="scan-a"></div><div class="scan-b"></div><div class="scan-c"></div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="cursor-dot" id="dot0"></div>
    </div>
    <div class="label-wrap">
      <div class="label-r" id="lr0"></div><div class="label-b" id="lb0"></div>
      <div class="label-base" id="lbl0">Maiores Projetos</div>
    </div>
  </div>
  <div class="card-row" id="row1" style="width:88%;max-width:546px">
    <div class="card" id="c1">
      <canvas id="cv1"></canvas>
      <div class="scanlines"></div>
      <div class="scan-a"></div><div class="scan-b"></div><div class="scan-c"></div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="cursor-dot" id="dot1"></div>
    </div>
    <div class="label-wrap">
      <div class="label-r" id="lr1"></div><div class="label-b" id="lb1"></div>
      <div class="label-base" id="lbl1">Experiências</div>
    </div>
  </div>
  <div class="card-row" id="row2" style="width:76%;max-width:472px">
    <div class="card" id="c2">
      <canvas id="cv2"></canvas>
      <div class="scanlines"></div>
      <div class="scan-a"></div><div class="scan-b"></div><div class="scan-c"></div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="cursor-dot" id="dot2"></div>
    </div>
    <div class="label-wrap">
      <div class="label-r" id="lr2"></div><div class="label-b" id="lb2"></div>
      <div class="label-base" id="lbl2">Certificados</div>
    </div>
  </div>
</div>

<script>
const CARD_H = 150;
const OVERFLOW = 22;
const PALETTES = [
  ['#D2AF50','#C8A83C','#E8C860','#B89028'],
  ['#C0A030','#D8B848','#E0C050','#A89020'],
  ['#B89828','#CAA838','#D8B840','#A08820']
];

const cards = [0,1,2].map(i=>({
  row: document.getElementById('row'+i),
  el:  document.getElementById('c'+i),
  cv:  document.getElementById('cv'+i),
  lbl: document.getElementById('lbl'+i),
  lr:  document.getElementById('lr'+i),
  lb:  document.getElementById('lb'+i),
  dot: document.getElementById('dot'+i),
  palette: PALETTES[i],
  particles:[],
  mouse:{x:-9999,y:-9999},
  hovered:false,
  animFrame:null,
  glitching:false,
  _stopRGB:null
}));

function getShapePts(type,cx,cy,sw,sh,n){
  const pts=[];
  if(type<0.65){
    for(let i=0;i<n;i++){
      const t=i/n,side=Math.floor(t*4),u=(t*4)%1;
      if(side===0) pts.push({x:cx-sw+u*sw*2,y:cy-sh});
      else if(side===1) pts.push({x:cx+sw,y:cy-sh+u*sh*2});
      else if(side===2) pts.push({x:cx+sw-u*sw*2,y:cy+sh});
      else pts.push({x:cx-sw,y:cy+sh-u*sh*2});
    }
  } else {
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2;
      pts.push({x:cx+Math.cos(a)*sw,y:cy+Math.sin(a)*sw});
    }
  }
  return pts;
}

function buildParticles(W,H,palette){
  const pts=[];
  const GAP=13;
  const cols=Math.floor((W+OVERFLOW*2-8)/GAP);
  const rows=Math.floor((H+OVERFLOW*2-8)/GAP);
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(Math.random()<0.35) continue;
      const x = W + OVERFLOW - 6 - c*GAP + Math.random()*3;
      const y = -OVERFLOW + 6 + r*GAP + Math.random()*3;
      const type=Math.random();
      const sw=Math.random()*4+2,sh=Math.random()*3+1.5;
      const col=palette[Math.floor(Math.random()*palette.length)];
      const n=Math.floor(Math.random()*6)+6;
      const sp=getShapePts(type,x,y,sw,sh,n);
      sp.forEach(p=>pts.push({
        ox:p.x,oy:p.y,
        x:p.x+(Math.random()-0.5)*70,
        y:p.y+(Math.random()-0.5)*70,
        vx:0,vy:0,
        size:Math.random()*0.85+0.5,
        alpha:Math.random()*0.3+0.45,
        col,
        angle:Math.random()*Math.PI*2,
        angV:(Math.random()-0.5)*0.014
      }));
    }
  }
  return pts;
}

const REPEL=80,FORCE=4.2,SPRING=0.05,DAMP=0.73;

function tick(card){
  const cv=card.cv,dpr=devicePixelRatio;
  const W=cv.width/dpr,H=cv.height/dpr;
  const ctx=cv.getContext('2d');
  ctx.clearRect(-OVERFLOW,-OVERFLOW,W+OVERFLOW*2,H+OVERFLOW*2);

  for(const p of card.particles){
    p.angle+=p.angV;
    const wob=card.hovered?3:0;
    const ox=p.ox+Math.sin(p.angle)*wob;
    const oy=p.oy+Math.cos(p.angle+1)*wob*0.7;
    const dx=p.x-card.mouse.x,dy=p.y-card.mouse.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<REPEL&&dist>0){
      const f=(1-dist/REPEL)*FORCE;
      p.vx+=(dx/dist)*f;p.vy+=(dy/dist)*f;
    }
    p.vx+=(ox-p.x)*SPRING;p.vy+=(oy-p.y)*SPRING;
    p.vx*=DAMP;p.vy*=DAMP;
    p.x+=p.vx;p.y+=p.vy;

    const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const boost=Math.min(1,speed*0.3);
    const sz=p.size+(card.hovered?boost*2:0);

    if(card.hovered){
      ctx.globalAlpha=Math.min(1,p.alpha+boost*0.4);
      ctx.fillStyle=p.col;
    } else {
      ctx.globalAlpha=p.alpha*0.5;
      ctx.fillStyle='rgba(190,190,190,1)';
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,sz,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  if(card.hovered&&card.mouse.x>0){
    ctx.beginPath();
    ctx.arc(card.mouse.x,card.mouse.y,3.5,0,Math.PI*2);
    ctx.fillStyle='rgba(210,175,80,0.9)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(card.mouse.x,card.mouse.y,REPEL,0,Math.PI*2);
    ctx.strokeStyle='rgba(210,175,80,0.07)';
    ctx.lineWidth=1;
    ctx.stroke();
  }
  card.animFrame=requestAnimationFrame(()=>tick(card));
}

function doGlitch(card){
  if(card.glitching)return;
  card.glitching=true;
  const txt=card.lbl.dataset.text;
  const chars='!<>-_\\/[]{}=+*^?#@$';
  let runs=0;
  const go=()=>{
    if(runs>=7){
      card.lbl.textContent=txt;
      card.lr.textContent=txt;
      card.lb.textContent=txt;
      card.glitching=false;return;
    }
    let out='';
    for(let i=0;i<txt.length;i++) out+=Math.random()<0.28?chars[Math.floor(Math.random()*chars.length)]:txt[i];
    card.lbl.textContent=out;
    card.lr.textContent=out;
    card.lb.textContent=out;
    runs++;setTimeout(go,52);
  };
  go();
}

function startRGB(card){
  const txt=card.lbl.dataset.text;
  card.lr.textContent=txt;
  card.lb.textContent=txt;
  let alive=true;
  card._stopRGB=()=>{alive=false;};
  const anim=()=>{
    if(!alive||!card.hovered){
      card.lr.style.opacity='0';
      card.lb.style.opacity='0';
      return;
    }
    const t=Math.sin(Date.now()*0.0028)*2.6;
    card.lr.style.transform=`translate(${t}px,${t*0.22}px)`;
    card.lr.style.opacity='0.5';
    card.lb.style.transform=`translate(${-t}px,${-t*0.22}px)`;
    card.lb.style.opacity='0.5';
    requestAnimationFrame(anim);
  };
  anim();
}

function setupCard(card,i){
  const setSize=()=>{
    const W=card.el.getBoundingClientRect().width||620;
    card.cv.width=Math.round(W*devicePixelRatio);
    card.cv.height=Math.round(CARD_H*devicePixelRatio);
    card.cv.style.width=W+'px';
    card.cv.style.height=CARD_H+'px';
    const ctx=card.cv.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(devicePixelRatio,devicePixelRatio);
    card.particles=buildParticles(W,CARD_H,card.palette);
  };
  setTimeout(setSize,50);

  card.lbl.dataset.text=card.lbl.textContent;
  card.lr.textContent=card.lbl.textContent;
  card.lb.textContent=card.lbl.textContent;

  card.el.addEventListener('mouseenter',()=>{
    card.hovered=true;
    card.el.classList.add('hovered');
    card.row.classList.add('hovered-row');
    card.dot.style.display='block';
    doGlitch(card);
    startRGB(card);
    cards.forEach((c,j)=>{
      if(j!==i) c.row.style.transform=`translateY(${j<i?-18:18}px)`;
    });
    if(card.animFrame)cancelAnimationFrame(card.animFrame);
    tick(card);
  });

  card.el.addEventListener('mouseleave',()=>{
    card.hovered=false;
    if(card._stopRGB)card._stopRGB();
    card.el.classList.remove('hovered');
    card.row.classList.remove('hovered-row');
    card.dot.style.display='none';
    card.mouse={x:-9999,y:-9999};
    cards.forEach(c=>c.row.style.transform='translateY(0)');
    if(card.animFrame)cancelAnimationFrame(card.animFrame);
    tick(card);
  });

  card.el.addEventListener('mousemove',e=>{
    const r=card.el.getBoundingClientRect();
    card.mouse.x=e.clientX-r.left;
    card.mouse.y=e.clientY-r.top;
    card.dot.style.left=card.mouse.x+'px';
    card.dot.style.top=card.mouse.y+'px';
  });

  window.addEventListener('resize',()=>setTimeout(setSize,50));
  setTimeout(()=>tick(card),90);
}

cards.forEach((c,i)=>setupCard(c,i));
</script>
